{% set name = "smbus2" %}
{% set version = "0.6.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/smbus2-{{ version }}.tar.gz
  sha256: 9b5ff1e998e114730f9dfe0c4babbef06c92468cfb61eaa684e30f225661b95b

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=2.7
  run:
    - python >=2.7

test:
  imports:
    - smbus2
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/kplindegaard/smbus2
  summary: smbus2 is a drop-in replacement for smbus-cffi/smbus-python in pure Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - untzag
    - ksunden
